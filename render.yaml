services:
  - type: web
    name: vera-challenge-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TEAM_NAME
        value: Solo Builder
      - key: CONTACT_EMAIL
        value: nikhil19092005@gmail.com
